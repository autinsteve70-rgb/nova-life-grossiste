<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Grossiste Nova Life RP</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#eef5ff;
color:#132238;
}

header{
background:linear-gradient(135deg,#0757b8,#0b86ff);
color:white;
text-align:center;
padding:35px 15px;
}

header h1{
margin:0;
font-size:32px;
}

header p{
margin-top:8px;
}

main{
max-width:1000px;
margin:25px auto;
padding:0 15px;
}

.card{
background:white;
padding:20px;
border-radius:16px;
margin-bottom:20px;
box-shadow:0 8px 25px #17375b12;
}

h2{
color:#0757b8;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
gap:15px;
}

.product{
border:1px solid #d9e5f3;
border-radius:12px;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
}

.price{
font-weight:bold;
color:#0757b8;
margin-top:5px;
}

.qty{
display:flex;
align-items:center;
gap:8px;
}

.qty button{
border:0;
background:#e8f2ff;
color:#0757b8;
border-radius:8px;
padding:8px 12px;
font-weight:bold;
font-size:16px;
cursor:pointer;
}

.qty button:hover{
background:#d5e8ff;
}

input,
select,
textarea{
width:100%;
padding:11px;
border:1px solid #ccd9e8;
border-radius:9px;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

textarea{
min-height:90px;
resize:vertical;
}

label{
font-weight:bold;
font-size:14px;
display:block;
margin-bottom:6px;
}

.total{
text-align:right;
font-size:24px;
font-weight:bold;
color:#0757b8;
margin-top:20px;
}

.delivery-info{
margin-top:12px;
padding:12px;
background:#f3f8ff;
border-radius:9px;
font-size:14px;
}

.btn{
border:0;
border-radius:9px;
padding:14px 20px;
background:#0757b8;
color:white;
font-weight:bold;
cursor:pointer;
margin-top:15px;
font-size:15px;
}

.btn:hover{
background:#064995;
}

.success{
margin-top:15px;
background:#e9f8ee;
border:1px solid #9dd5ad;
padding:15px;
border-radius:10px;
white-space:pre-wrap;
}

.error{
margin-top:15px;
background:#ffecec;
border:1px solid #e5a0a0;
padding:15px;
border-radius:10px;
}

@media(max-width:600px){

.product{
align-items:flex-start;
flex-direction:column;
}

.total{
text-align:left;
}

}

</style>

</head>


<body>


<header>

<h1>NOVA GROSSISTE</h1>

<p>Votre fournisseur professionnel sur Nova Life RP</p>

</header>


<main>


<!-- CATALOGUE -->

<div class="card">

<h2>📦 Catalogue</h2>

<div id="products" class="grid"></div>

<div class="total">

Total : <span id="total">0 €</span>

</div>

</div>


<!-- COMMANDE -->

<div class="card">

<h2>🧾 Passer une commande</h2>


<div class="grid">


<div>

<label>Entreprise / Client *</label>

<input
id="client"
type="text"
placeholder="Ex : Garage Martin"
>

</div>


<div>

<label>Responsable *</label>

<input
id="resp"
type="text"
placeholder="Ex : Jean Martin"
>

</div>


<div>

<label>Téléphone RP</label>

<input
id="phone"
type="text"
placeholder="Ex : 06 12 34 56 78"
>

</div>


<div>

<label>Discord</label>

<input
id="discord"
type="text"
placeholder="Ex : JeanMartin"
>

</div>


<div>

<label>Réception</label>

<select id="delivery">

<option value="Livraison à domicile">
Livraison à domicile (+30 €)
</option>

<option value="Retrait sur place">
Retrait sur place (gratuit)
</option>

</select>

</div>


<div>

<label>Date souhaitée</label>

<input
id="date"
type="date"
>

</div>


</div>


<div class="delivery-info">

🚚 <b>Livraison à domicile :</b> +30 €<br>

📍 <b>Retrait sur place :</b> gratuit

</div>


<div style="margin-top:15px">

<label>Commentaire</label>

<textarea
id="notes"
placeholder="Informations supplémentaires..."
></textarea>

</div>


<button
class="btn"
onclick="sendOrder()"
>

✅ Envoyer ma commande

</button>


<div id="result"></div>


</div>


</main>


<script>


/* =========================
   PRODUITS
========================= */

const products = [

{
name:"Batterie",
price:500
},

{
name:"Pneu",
price:300
},

{
name:"Pièce mécanique",
price:250
},

{
name:"Huile",
price:150
}

];


let cart = {};


/* =========================
   FORMAT PRIX
========================= */

const euro = n =>
new Intl.NumberFormat("fr-FR").format(n) + " €";


/* =========================
   AFFICHAGE PRODUITS
========================= */

function render(){

let container =
document.getElementById("products");

container.innerHTML = "";


products.forEach((p,i)=>{

let q = cart[i] || 0;


container.innerHTML += `

<div class="product">

<div>

<b>${p.name}</b>

<div class="price">
${euro(p.price)}
</div>

</div>


<div class="qty">

<button onclick="chg(${i},-1)">
−
</button>

<b>${q}</b>

<button onclick="chg(${i},1)">
+
</button>

</div>

</div>

`;

});


total();

}


/* =========================
   MODIFIER QUANTITE
========================= */

function chg(i,d){

cart[i] =
Math.max(
0,
(cart[i] || 0) + d
);

render();

}


/* =========================
   CALCUL TOTAL
========================= */

function total(){

let subtotal =
products.reduce(
(s,p,i)=>
s + p.price * (cart[i] || 0),
0
);


let delivery =
document.getElementById("delivery").value;


let deliveryFee =
delivery === "Livraison à domicile"
? 30
: 0;


let finalTotal =
subtotal + deliveryFee;


document.getElementById("total").textContent =
euro(finalTotal);


return finalTotal;

}


/* =========================
   ACTUALISER TOTAL LIVRAISON
========================= */

document
.getElementById("delivery")
.addEventListener(
"change",
total
);


/* =========================
   ENVOYER COMMANDE
========================= */

async function sendOrder(){


/* PRODUITS CHOISIS */

let chosen =
products
.map((p,i)=>({

p:p,

i:i,

q:cart[i] || 0

}))
.filter(x=>x.q);


/* INFORMATIONS CLIENT */

let c =
document
.getElementById("client")
.value
.trim();


let r =
document
.getElementById("resp")
.value
.trim();


/* VERIFICATION */

if(
!c ||
!r ||
!chosen.length
){

alert(
"Renseigne le client, le responsable et ajoute au moins un produit."
);

return;

}


/* NUMERO COMMANDE */

let id =
"CMD-" +
Math.random()
.toString(36)
.slice(2,8)
.toUpperCase();


/* SOUS-TOTAL */

let subtotal =
chosen.reduce(
(s,x)=>
s + x.p.price * x.q,
0
);


/* LIVRAISON */

let delivery =
document
.getElementById("delivery")
.value;


let deliveryFee =
delivery === "Livraison à domicile"
? 30
: 0;


/* TOTAL FINAL */

let finalTotal =
subtotal + deliveryFee;


/* LISTE PRODUITS */

let productText =
chosen
.map(x =>
`${x.p.name} × ${x.q} — ${euro(x.p.price * x.q)}`
)
.join("\n");


/* DONNEES ENVOYEES A GOOGLE APPS SCRIPT */

let payload = {

id:id,

client:c,

responsable:r,

phone:
document
.getElementById("phone")
.value,

discord:
document
.getElementById("discord")
.value,

delivery:delivery,

deliveryFee:deliveryFee,

date:
document
.getElementById("date")
.value ||
"Non précisée",

products:productText,

total:finalTotal,

notes:
document
.getElementById("notes")
.value ||
"Aucun"

};


/* ENVOI */

try{


await fetch(

"https://script.google.com/macros/s/AKfycbwiefKmCIG6au5RX4CkEqvLCI8sn1ckHAhCo_cjyiWf87SOqn_7sW9L_LzICR0N8G-Vjg/exec",

{

method:"POST",

headers:{
"Content-Type":
"text/plain;charset=utf-8"
},

mode:"no-cors",

body:
JSON.stringify(payload)

}

);


/* CONFIRMATION */

document
.getElementById("result")
.innerHTML = `

<div class="success">

<b>✅ Commande ${id} envoyée !</b>

Votre commande a été transmise à la direction.

Sous-total : ${euro(subtotal)}

Frais de livraison : ${euro(deliveryFee)}

💰 TOTAL : ${euro(finalTotal)}

</div>

`;


}catch(error){


document
.getElementById("result")
.innerHTML = `

<div class="error">

❌ Une erreur est survenue.

La commande n'a pas pu être envoyée.

</div>

`;

}

}


/* =========================
   DEMARRAGE
========================= */

render();


</script>


</body>

</html>
